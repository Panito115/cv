<div class="page-wrap">
  <div class="cv-grid">
    <!-- LADO IZQUIERDO -->
    <aside class="sidebar">
      <!-- Botón de tema -->
      <div class="theme-toggle position-absolute top-0 start-0 m-3">
        <button (click)="toggleTheme()" class="btn btn-light btn-sm rounded-circle shadow" title="Cambiar tema">
          <i class="bi" [ngClass]="(isLight$ | async) ? 'bi-brightness-high-fill' : 'bi-moon-fill'"></i>
        </button>
      </div>

      <!-- Foto + nombre -->
      <img src="/img/mi_foto.png" alt="Foto de perfil" class="avatar">
      <div class="name-role">
        <div class="skeleton title-lg">Juan Pablo Madriz</div>
        <div class="skeleton title-md">Computer Scientist</div>
        <span class="badge bg-success">Tesla CEO</span>
      </div>

      <!-- PERFIL -->
      <cv-block title="PERFIL">
        <div class="perfil-text">
          {{ perfilText }}
        </div>
      </cv-block>

      <!-- SOCIAL MEDIA -->
      <cv-block title="SOCIAL MEDIA" [collapsible]="true" storageKey="social" extraClasses="block-social">
        <div class="d-flex gap-3 mb-3 mt-2">
          <a *ngFor="let s of socialLinks" [href]="s.href" target="_blank" class="d-flex align-items-center text-decoration-none">
            <img [src]="s.img" [alt]="s.alt" width="40" height="40" class="rounded-circle border">
          </a>
        </div>

        <!-- Botón: Descargar CV -->
        <a href="/docs/JuanPabloMadriz_CV.pdf" download class="btn btn-primary btn-lg w-100 my-3">
          <i class="bi bi-file-earmark-arrow-down"></i> Descargar CV
        </a>

        <!-- Botón: Descargar Certificado -->
        <a href="/docs/JuanPabloMadriz_Certificado.pdf" download class="btn btn-secondary btn-lg w-100 my-3">
          <i class="bi bi-file-earmark-arrow-down"></i> Descargar Certificado
        </a>
      </cv-block>
    </aside>

    <!-- LADO DERECHO -->
    <main class="content">
      <!-- SOFT SKILLS (color por defecto) -->
      <cv-panel title="SOFT SKILLS">
        <section class="specialties">
          <div class="spec" *ngFor="let i of [1,2,3,4,5,6]">
            <span class="glyph"></span>
          </div>
        </section>
      </cv-panel>

      <!-- EXPERIENCIA LABORAL (colapsable) -->
      <cv-panel title="EXPERIENCIA LABORAL" [collapsible]="true" storageKey="experience" bodyClass="experience">
        <article class="exp-row" *ngFor="let e of experience">
          <div class="year">{{ e.year }}</div>
          <div>
            <h3 class="block-title exp-title mb-1">{{ e.title }}</h3>
            <p class="mb-0">{{ e.desc }}</p>
          </div>
        </article>
      </cv-panel>

      <!-- HABILIDADES (header rojo mediante clase del host) -->
      <cv-panel title="HABILIDADES" class="skills-panel" [stripBottom]="true">
        <div class="skills-search-panel">
          <input [(ngModel)]="skillQuery"
                 type="search"
                 class="form-control form-control-sm"
                 placeholder="Buscar habilidad..."
                 aria-label="Buscar habilidad" />
        </div>

        <section class="skills">
          <div class="skill" *ngFor="let s of filteredSkills()">
            <span class="label short">{{ s.name }}</span>
            <div class="dots">
              <span class="dot"
                    *ngFor="let filled of range(s.level)"
                    [style.background]="filled ? 'currentColor' : 'transparent'"></span>
            </div>
          </div>
        </section>
      </cv-panel>

      <!-- EDUCACIÓN (header verde mediante clase del host) -->
      <cv-panel title="EDUCACIÓN" class="education-panel" [stripBottom]="true" bodyClass="experience">
        <article class="exp-row" *ngFor="let ed of education">
          <div class="year">{{ ed.year }}</div>
          <div>
            <h3 class="block-title exp-title mb-1">{{ ed.title }}</h3>
            <p class="mb-0">{{ ed.desc }}</p>
          </div>
        </article>
      </cv-panel>
    </main>
  </div>
</div>
